name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.flavor }} - ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux x86_64 ---
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            flavor: normal
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            flavor: nvidia
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            flavor: amd
            
          # --- Linux ARM64 ---
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            flavor: normal
            
          # --- Windows x86_64 ---
          - runner: windows-latest
            platform: windows
            arch: x86_64
            flavor: normal
          - runner: windows-latest
            platform: windows
            arch: x86_64
            flavor: nvidia
          - runner: windows-latest
            platform: windows
            arch: x86_64
            flavor: amd
            
          # --- macOS ARM64 ---
          - runner: macos-14
            platform: macos
            arch: aarch64
            flavor: normal

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build clang \
            libclang-dev llvm-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libx11-dev

      - name: Install macOS system deps
        if: runner.os == 'macOS'
        run: brew install cmake ninja libomp llvm || true

      - name: Install CUDA Toolkit
        if: matrix.flavor == 'nvidia'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.6.0'

      - name: Install Vulkan SDK
        if: matrix.flavor == 'amd'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          stripdown: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable



      - name: Build and Bundle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/make_release.sh
          
          FEATURES="llama-cpp-static"
          if [ "${{ matrix.flavor }}" = "nvidia" ]; then
            FEATURES="$FEATURES,cuda"
          elif [ "${{ matrix.flavor }}" = "amd" ]; then
            FEATURES="$FEATURES,vulkan"
          fi
          
          ./packaging/make_release.sh --flavor "${{ matrix.flavor }}" --features "$FEATURES"
          
      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: hercules-${{ matrix.flavor }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: hercules-*
          merge-multiple: true
          
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
