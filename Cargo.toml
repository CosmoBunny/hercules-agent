[package]
name = "hercules-agent"
version = "0.0.3"
edition = "2024"
description = "Hercules Agent — local AI coding TUI (llama.cpp statically linked or in-process via libllama.so)"
license = "MIT"
readme = "README.md"
keywords = ["llm", "tui", "agent", "llama", "local"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"

[lib]
name = "hercules_agent"
path = "src/lib.rs"

[[bin]]
name = "hercules"
path = "src/main.rs"

[features]
default = ["simd", "parallel", "llama-cpp-static"]
# std::arch SIMD kernels for desktop CPUs (still pure Rust).
simd = []
# Multi-thread GEMV via rayon (desktop/server; disable for embedded).
parallel = ["dep:rayon"]
# GPU acceleration via wgpu (Vulkan/Metal/DX12/WebGPU). Adds burn dependency.
gpu = ["dep:burn"]
# CUDA acceleration for llama.cpp backend.
cuda = []
# Vulkan (AMD/Intel) acceleration for llama.cpp backend.
vulkan = []
# Full desktop feature set: SIMD + rayon + GPU.
full = ["simd", "parallel", "gpu", "llama-cpp-static"]
# Tighter defaults: single-thread, no rayon preference.
embedded = []
# Build llama.cpp as static libs (no shared library needed at runtime).
# Enabled by default.
llama-cpp-static = []
# Legacy: in-process llama.cpp shared library bindings — fallback path.
llama-cpp-bindings = []
# Legacy pure-Rust GGUF engine (kept for reference; not activated at runtime).
llama-rs = []

[dependencies]
burn = { version = "0.21.0", features = ["wgpu"], optional = true }
cand = "0.3.2"
crossterm = "0.29.0"
thiserror = "1.0"
futures-util = "0.3.33"
hf-hub = { version = "0.3.2", features = ["tokio"] }
kramaframe = "0.2.3"
libc = "0.2.189"
libloading = "0.8"
ollama-rs = { version = "0.3.5", features = ["stream"] }
ratatui = "0.30.0"
reqwest = { version = "0.13.4", features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
arboard = "3.4.0"
toml = "1.1.2"
rayon = { version = "1.10", optional = true }
websearch = "0.1.1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
ratatui-markdown = "0.3.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
ratatui-image = "4.0"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
lsp-types = "0.97"
anyhow = "1.0"
which = "6.0"
url = "2.5"
tracing = "0.1"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3.10"

