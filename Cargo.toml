[package]
name = "hercules-agent"
version = "0.1.0"
edition = "2024"
description = "Hercules Agent — local AI coding TUI (llama.cpp statically linked or in-process via libllama.so)"
license = "MIT"
readme = "README.md"
keywords = ["llm", "tui", "agent", "llama", "local"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"

[lib]
name = "hercules_agent"
path = "src/lib.rs"

[[bin]]
name = "hercules"
path = "src/main.rs"

[features]
default = ["simd", "parallel"]
# std::arch SIMD kernels for desktop CPUs (still pure Rust).
simd = []
# Multi-thread GEMV via rayon (desktop/server; disable for embedded).
parallel = ["dep:rayon"]
# GPU acceleration via wgpu (Vulkan/Metal/DX12/WebGPU). Adds burn dependency.
gpu = ["dep:burn"]
# Full desktop feature set: SIMD + rayon + GPU.
full = ["simd", "parallel", "gpu"]
# Tighter defaults: single-thread, no rayon preference.
embedded = []
# Build llama.cpp as static libs (no shared library needed at runtime).
# Requires cmake + a C++17 compiler. Either:
#   a) Add as a git submodule:  git submodule add https://github.com/ggerganov/llama.cpp.git
#   b) Set LLAMA_CPP_SRC=/path/to/llama.cpp before building.
#   c) Nothing — build.rs will auto-clone into $OUT_DIR (needs internet on first build).
# Enable with:  cargo build --features llama-cpp-static
llama-cpp-static = []
# Legacy: in-process llama.cpp shared library bindings — still the default path.
llama-cpp-bindings = []
# Legacy pure-Rust GGUF engine (kept for reference; not activated at runtime).
llama-rs = []

[dependencies]
burn = { version = "0.21.0", features = ["wgpu"], optional = true }
cand = "0.3.2"
crossterm = "0.29.0"
futures-util = "0.3.33"
hf-hub = { version = "0.3.2", features = ["tokio"] }
kramaframe = "0.2.3"
libc = "0.2.189"
libloading = "0.8"
ollama-rs = { version = "0.3.5", features = ["stream"] }
ratatui = "0.30.0"
reqwest = { version = "0.13.4", features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
arboard = "3.4.0"
toml = "1.1.2"
rayon = { version = "1.10", optional = true }
